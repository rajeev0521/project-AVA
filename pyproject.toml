[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ava-assistant"
version = "2.0.0"
description = "AVA – Voice-Based AI Calendar Assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.2",
    "tzlocal",
    "pytz",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "google-genai>=0.1.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-api-python-client>=2.86.0",
    "supabase>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "scikit-learn>=1.3.0",
    "numpy",
    "httpx>=0.25.0",
    "upstash-redis>=1.2.0",
]

[project.optional-dependencies]
desktop = [
    "SpeechRecognition>=3.10.0",
    "pyaudio>=0.2.13",
    "sounddevice>=0.4.6",
    "scipy",
    "pyttsx3",
    "openai-whisper",
    "openwakeword",
    "elevenlabs>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["ava"]
